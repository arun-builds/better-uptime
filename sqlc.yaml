version: "2"

sql:
  - engine: "postgresql"
    queries: "./sql/queries"
    schema: "./migrations"

    gen:
      go:
        package: "store"
        out: "./internal/store"

        sql_package: "pgx/v5"

        emit_json_tags: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
